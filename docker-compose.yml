services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: padraocerto_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - padraocerto_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: padraocerto_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=padraocerto
      - SESSION_SECRET=padraocerto_secret
    command: npm run dev
    depends_on:
      db:
        condition: service_healthy
    networks:
      - padraocerto_network

  db:
    image: mysql:8.0
    container_name: padraocerto_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=padraocerto
    volumes:
      - padraocerto_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - padraocerto_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: padraocerto_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
    depends_on:
      - db
    networks:
      - padraocerto_network

volumes:
  backend_node_modules:
  frontend_node_modules:
  padraocerto_db_data:

networks:
  padraocerto_network:
    driver: bridge
